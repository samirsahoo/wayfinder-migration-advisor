[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfinder"
version = "0.1.0"
description = "An agentic AI advisor for cloud migration and digital transformation planning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samir Kumar Sahoo" }]
dependencies = [
    "langgraph>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
wayfinder = "wayfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
